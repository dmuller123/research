<!-- ===================== --><!-- ORCID PUBLICATIONS JS --><!-- ===================== -->
<script>
const ORCID_ID = "0000-0001-8184-1474";
const ORCID_API = `https://pub.orcid.org/v3.0/${ORCID_ID}/works`;
async function fetchJSON(url, headers = {}) {
try {
const response = await fetch(url, { headers });
if (!response.ok) return null;
return response.json();
} catch (e) {
console.error(e);
return null;
}
}
function extractDOI(work) {
const ids = work["external-ids"]?.["external-id"] || [];
for (const id of ids) {
if (id["external-id-type"] === "doi") {
return id["external-id-value"];
}
}
return null;
}
async function fetchCrossrefMetadata(doi) {
const url = `https://api.crossref.org/works/${encodeURIComponent(doi)}`;
const data = await fetchJSON(url);
if (!data || !data.message) return {};
const msg = data.message;
const authors = (msg.author || [])
.map(a => `${a.given || ""} ${a.family || ""}`.trim())
.join(", ");
const journal =
msg["container-title"] && msg["container-title"].length
? msg["container-title"][0]
: "";
return { authors, journal };
}
async function loadPublications() {
const container = document.getElementById("publications");
container.innerHTML = "<p>Loading publications…</p>";
const worksData = await fetchJSON(ORCID_API, {
"Accept": "application/json"
});
if (!worksData) {
container.innerHTML = "<p>Failed to load publications.</p>";
return;
}
const publicationsByYear = {};
for (const group of worksData.group) {
const summary = group["work-summary"][0];
const year = summary["publication-date"]?.year?.value || "Unknown year";
if (!publicationsByYear[year]) publicationsByYear[year] = [];
publicationsByYear[year].push(summary);
}
const years = Object.keys(publicationsByYear)
.sort((a, b) => b.localeCompare(a));
container.innerHTML = "";
for (const year of years) {
const y = document.createElement("div");
y.className = "year";
y.textContent = year;
container.appendChild(y);
for (const summary of publicationsByYear[year]) {
const title = summary.title?.title?.value || "Untitled";
const doi = extractDOI(summary);
let authors = "";
let journal = "";
if (doi) {
const meta = await fetchCrossrefMetadata(doi);
authors = meta.authors || "";
journal = meta.journal || "";
}
const safeDOI = doi ? doi.replace(/\//g, "_") : null;
const imagePath = safeDOI
? `graphical_abstract/${safeDOI}.jpg`
: null;
const pub = document.createElement("div");
pub.className = "publication-container";
pub.innerHTML = `
<div class="pub-details">
<h3>${title}</h3>
${authors ? `<p><strong>Authors:</strong> ${authors}</p>` : ""}
${journal ? `<p><strong>Journal:</strong> ${journal}</p>` : ""}
${doi ? `<p><strong>DOI:</strong> <a href="https://doi.org/${doi}" target="_blank">${doi}</a></p>` : ""}
</div>
<div class="pub-image">
${imagePath
? `<img src="${imagePath}" alt="Graphical abstract"
onerror="this.parentNode.innerHTML='<div class=placeholder>Graphical abstract not available</div>'">`
: `<div class="placeholder">Graphical abstract not available</div>`}
</div>
`;
container.appendChild(pub);
}
}
}
$(document).ready(loadPublications);
</script>
